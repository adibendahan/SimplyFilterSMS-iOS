name: Propose a Community List
description: Suggest a filter list for the Community Lists directory in Simply Filter SMS.
title: "[Community List] "
labels: ["community-list"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing your list! Before proposing it, check it follows the [guide](https://github.com/adibendahan/SimplyFilterSMS-iOS/blob/develop/docs/COMMUNITY_LISTS_GUIDE.md). Listed lists appear for every user, so each one is reviewed first.
  - type: input
    id: url
    attributes:
      label: List URL
      description: A public HTTPS link that downloads the .sfsfilters file itself.
      placeholder: https://github.com/you/repo/releases/latest/download/list.sfsfilters
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Name
      description: The list's title, as in its "name" field.
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What the list blocks or allows, and who it's for.
    validations:
      required: true
  - type: input
    id: locale
    attributes:
      label: Locale
      description: The language and country of the messages it targets, as in its "locale" field.
      placeholder: en-US
    validations:
      required: true
  - type: checkboxes
    id: maintenance
    attributes:
      label: Maintenance
      options:
        - label: I maintain this list and will keep the link working.
          required: true
