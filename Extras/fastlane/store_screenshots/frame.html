<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Store screenshot</title>
<style>
@font-face { font-family: "Store SF Hebrew"; src: url("file:///System/Library/Fonts/SFHebrew.ttf"); font-weight: 1 1000; }
@font-face { font-family: "Store SF Arabic"; src: url("file:///System/Library/Fonts/SFArabic.ttf"); font-weight: 1 1000; }
@font-face { font-family: "Store Hiragino"; src: url("file:///System/Library/Fonts/ヒラギノ角ゴシック W6.ttc"); font-weight: 1 750; }
@font-face { font-family: "Store Hiragino"; src: url("file:///System/Library/Fonts/ヒラギノ角ゴシック W8.ttc"); font-weight: 751 1000; }
html[lang="ja"] body { font-family: -apple-system, "SF Pro Display", "Store Hiragino", system-ui, sans-serif; }
html, body { margin: 0; padding: 0; }
body { background: #F4F1EA; overflow: hidden; font-family: -apple-system, "SF Pro Display", "Store SF Hebrew", "Store SF Arabic", system-ui, sans-serif; }
#canvas { position: relative; overflow: hidden; background: #F4F1EA; }
#text { position: absolute; left: 0; right: 0; text-align: center; }
#title { margin: 0; font-weight: 700; line-height: 1.12; color: #1C1C1E; text-wrap: balance; }
#screen, #frame { position: absolute; display: block; }
html[lang="ja"] #title { word-break: auto-phrase; }
html[lang="ko"] #title { word-break: keep-all; }
</style>
</head>
<body>
<div id="canvas">
<div id="text"><h1 id="title"></h1></div>
<img id="screen" alt="">
<img id="frame" alt="">
</div>
<script>
const LAYOUTS = {
    "iphone": {
        size: [1320, 2868],
        frame: "iPhone 18 Pro Max - Black - Portrait.png",
        frameSize: [1470, 3000],
        screenOrigin: [75, 66],
        screenRadii: [184, 184, 184, 184],
        frameWidth: 1300,
        frameTop: 600,
        textTop: 120,
        textInset: 60,
        titleSize: 156,
        circle: { diameter: 3600, top: 638, blur: 144 }
    },
    "duo-outer": {
        size: [1398, 2034],
        frame: "iPhone Duo - Night Sky - Outer Closed Portrait.png",
        frameSize: [1574, 2194],
        screenOrigin: [88, 80],
        screenRadii: [20, 170, 170, 20],
        frameWidth: 1220,
        frameTop: 530,
        textTop: 120,
        textInset: 60,
        titleSize: 128,
        circle: { diameter: 3810, top: 380, blur: 144 }
    },
    "ipad": {
        size: [2752, 2064],
        frame: "iPad Pro (M5) 13\" - Space Black - Landscape.png",
        frameSize: [3000, 2300],
        screenOrigin: [124, 118],
        screenRadii: [54, 54, 54, 54],
        frameWidth: 2400,
        frameTop: 441,
        textTop: 132,
        textInset: 120,
        titleSize: 128,
        circle: { diameter: 7428, top: 291, blur: 180 }
    },
    "duo-inner": {
        size: [2853, 2007],
        frame: "iPhone Duo - Night Sky - Inner Open Landscape.png",
        frameSize: [3093, 2247],
        screenOrigin: [120, 120],
        screenRadii: [156, 156, 156, 156],
        frameWidth: 2750,
        frameTop: 270,
        textTop: 60,
        textInset: 120,
        titleSize: 128,
        minTextGap: 60,
        circle: { diameter: 7710, top: 126, blur: 180 }
    }
};
const MIN_TEXT_GAP = 100;
const MIN_TITLE_SCALE = 0.6;
const BEZELS = "../../local/bezels/";
const PAPER_COLOR = "#F4F1EA";
const CIRCLE_COLOR = "#AED7A2";
const EMPHASIS_COLOR = "#2B7A3D";
const EDGE_PROFILE = [[-3, 100], [-2, 97.7], [-1.5, 93.3], [-1, 84.1], [-0.5, 69.1], [0, 50], [0.5, 30.9], [1, 15.9], [1.5, 6.7], [2, 2.3], [3, 0]];

const params = new URLSearchParams(location.search);
const layout = LAYOUTS[params.get("device")];
const [width, height] = layout.size;
const scale = layout.frameWidth / layout.frameSize[0];

document.documentElement.lang = params.get("lang") || "en";
document.documentElement.dir = params.get("dir") || "ltr";

const canvas = document.getElementById("canvas");
canvas.style.width = width + "px";
canvas.style.height = height + "px";

const text = document.getElementById("text");
text.style.top = layout.textTop + "px";
text.style.padding = "0 " + layout.textInset + "px";

const title = document.getElementById("title");
const titleParts = (params.get("title") || "").split("*");
titleParts.forEach((part, index) => {
    const isEmphasized = index % 2 === 1;
    if (isEmphasized) {
        const emphasis = document.createElement("span");
        emphasis.textContent = part;
        emphasis.style.color = EMPHASIS_COLOR;
        title.appendChild(emphasis);
    } else {
        title.appendChild(document.createTextNode(part));
    }
});
title.style.fontSize = layout.titleSize + "px";
title.style.letterSpacing = "-1.5px";

const frameTop = layout.frameTop;
function fitTitle() {
    const textLimit = frameTop - (layout.minTextGap ?? MIN_TEXT_GAP);
    const minimumTitleSize = layout.titleSize * MIN_TITLE_SCALE;
    let titleSize = layout.titleSize;
    while (text.getBoundingClientRect().bottom > textLimit && titleSize > minimumTitleSize) {
        titleSize -= 1;
        title.style.fontSize = titleSize + "px";
    }
}
text.getBoundingClientRect();
document.fonts.ready.then(fitTitle);
const frameLeft = (width - layout.frameWidth) / 2;

const radius = layout.circle.diameter / 2;
const sigma = layout.circle.blur;
const circleCenterY = layout.circle.top + radius;
const edgeStops = EDGE_PROFILE.map(([offset, share]) => {
    const color = "color-mix(in srgb, " + CIRCLE_COLOR + " " + share + "%, " + PAPER_COLOR + ")";
    return color + " " + (radius + offset * sigma) + "px";
});
canvas.style.backgroundImage = "radial-gradient(circle at " + width / 2 + "px " + circleCenterY + "px, " + edgeStops.join(", ") + ")";

const frame = document.getElementById("frame");
frame.style.left = frameLeft + "px";
frame.style.top = frameTop + "px";
frame.style.width = layout.frameWidth + "px";
frame.src = BEZELS + encodeURIComponent(layout.frame);

const screen = document.getElementById("screen");
screen.style.left = frameLeft + layout.screenOrigin[0] * scale + "px";
screen.style.top = frameTop + layout.screenOrigin[1] * scale + "px";
screen.style.width = width * scale + "px";
screen.style.height = height * scale + "px";
screen.style.borderRadius = layout.screenRadii.map(radius => radius * scale + "px").join(" ");
screen.src = params.get("shot");
</script>
</body>
</html>
