<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Search 3:2</title>
<style>
@font-face { font-family: "Store SF Hebrew"; src: url("file:///System/Library/Fonts/SFHebrew.ttf"); font-weight: 1 1000; }
@font-face { font-family: "Store SF Arabic"; src: url("file:///System/Library/Fonts/SFArabic.ttf"); font-weight: 1 1000; }
html, body { margin: 0; padding: 0; width: 3840px; height: 2560px; overflow: hidden; background: #F4F1EA; }
#canvas { position: relative; width: 3840px; height: 2560px; overflow: hidden; background: #F4F1EA; font-family: -apple-system, "SF Pro Display", "Store SF Hebrew", "Store SF Arabic", system-ui, sans-serif; color: #1C1C1E; }
#head { position: absolute; left: 0; top: 200px; width: 3840px; display: flex; flex-direction: column; align-items: center; gap: 84px; }
#title { margin: 0; font-size: 200px; font-weight: 700; letter-spacing: -4px; line-height: 1.02; text-align: center; white-space: nowrap; }
#badges { display: flex; gap: 144px; align-items: center; }
.badge { display: flex; align-items: center; gap: 39px; }
.badge img { width: 105px; height: 105px; display: block; }
.badge span { font-size: 78px; font-weight: 600; line-height: 1; white-space: nowrap; }
.phone { position: absolute; transform-origin: 50% 0; }
.phone img { position: absolute; display: block; }
</style>
</head>
<body>
<div id="canvas">
<div id="head"><h1 id="title"></h1><div id="badges"></div></div>
<div id="phones"></div>
</div>
<script>
const ICONS = "../../store_screenshots/icons/";
const FRAME = "../../../local/bezels/" + encodeURIComponent("iPhone 18 Pro Max - Black - Portrait.png");
const PHONES = [
    { shot: "ai.png", left: 520, top: 900, width: 900, angle: -7, z: 1 },
    { shot: "blocked.png", left: 2420, top: 900, width: 900, angle: 7, z: 1 },
    { shot: "home.png", left: 1430, top: 780, width: 980, angle: 0, z: 2 }
];
const MAX_TITLE_WIDTH = 3440;
const PAPER = "#F4F1EA", GREEN = "#AED7A2", EMPHASIS = "#2B7A3D";
const EDGE = [[-3, 100], [-2, 97.7], [-1.5, 93.3], [-1, 84.1], [-0.5, 69.1], [0, 50], [0.5, 30.9], [1, 15.9], [1.5, 6.7], [2, 2.3], [3, 0]];
const CIRCLE = { cx: 1920, top: 640, diameter: 6400, blur: 180 };

const params = new URLSearchParams(location.search);
const language = params.get("lang") || "en";
document.documentElement.lang = language;
document.documentElement.dir = params.get("dir") || "ltr";

const title = document.getElementById("title");
(params.get("title") || "").split("*").forEach((part, index) => {
    if (index % 2 === 1) {
        const emphasis = document.createElement("span");
        emphasis.textContent = part;
        emphasis.style.color = EMPHASIS;
        title.appendChild(emphasis);
    } else {
        title.appendChild(document.createTextNode(part));
    }
});
let titleSize = 200;
while (title.getBoundingClientRect().width > MAX_TITLE_WIDTH) {
    titleSize -= 2;
    title.style.fontSize = titleSize + "px";
}

const badges = document.getElementById("badges");
[["lock-duotone.svg", params.get("private")], ["code-duotone.svg", params.get("openSource")]].forEach(([file, label]) => {
    const badge = document.createElement("div");
    badge.className = "badge";
    const icon = document.createElement("img");
    icon.src = ICONS + file;
    icon.alt = "";
    const name = document.createElement("span");
    name.textContent = label;
    badge.append(icon, name);
    badges.append(badge);
});

const phones = document.getElementById("phones");
PHONES.forEach(p => {
    const k = p.width / 1470;
    const phone = document.createElement("div");
    phone.className = "phone";
    Object.assign(phone.style, { left: p.left + "px", top: p.top + "px", width: p.width + "px", height: 3000 * k + "px", zIndex: p.z, transform: "rotate(" + p.angle + "deg)" });
    const screen = document.createElement("img");
    screen.src = "screens/" + language + "/" + p.shot;
    Object.assign(screen.style, { left: 75 * k + "px", top: 66 * k + "px", width: 1320 * k + "px", height: 2868 * k + "px", borderRadius: 184 * k + "px" });
    const frame = document.createElement("img");
    frame.src = FRAME;
    frame.style.width = p.width + "px";
    phone.append(screen, frame);
    phones.append(phone);
});

const radius = CIRCLE.diameter / 2;
const stops = EDGE.map(([offset, share]) => "color-mix(in srgb, " + GREEN + " " + share + "%, " + PAPER + ") " + (radius + offset * CIRCLE.blur) + "px");
document.getElementById("canvas").style.backgroundImage = "radial-gradient(circle at " + CIRCLE.cx + "px " + (CIRCLE.top + radius) + "px, " + stops.join(", ") + ")";
</script>
</body>
</html>
